tool_contract_set:
  id: hotel-aurora-tools-v0.1
  world_id: hotel-aurora-v0.1
  status: frozen_for_mr0_001
  frozen_on: "2026-08-21"
  determinism_rules:
    - Tools return the same output for the same valid input.
    - Tools do not mutate the fixture files or persist state between calls.
    - Unknown reservations, rooms, query keys, or enum values return accepted false or found false with a stable message_key.
    - User-facing text is generated outside the tool layer from message_key and returned facts.
  tools:
    - name: lookup_reservation
      purpose: Retrieve deterministic reservation facts.
      deterministic: true
      input_schema:
        required_any:
          - reservation_id
          - guest_name
        fields:
          reservation_id:
            type: string
            pattern: "^R[0-9]{3}$"
          guest_name:
            type: string
            match: case_insensitive_exact
      output_schema:
        fields:
          reservation_found: boolean
          reservation:
            type: object_or_null
            source: world.deterministic_reservations
          message_key: string
      deterministic_behavior:
        match_priority:
          - reservation_id
          - guest_name
        found_message_key: reservation.found
        not_found_message_key: reservation.not_found
      deterministic_examples:
        - input:
            reservation_id: R104
          output:
            reservation_found: true
            reservation_id: R104
            message_key: reservation.found
        - input:
            guest_name: Carlos Mendoza
          output:
            reservation_found: true
            reservation_id: R218
            message_key: reservation.found
        - input:
            reservation_id: R999
          output:
            reservation_found: false
            reservation_id: null
            message_key: reservation.not_found
    - name: search_hotel_knowledge
      purpose: Retrieve deterministic Hotel Aurora policy and knowledge facts.
      deterministic: true
      input_schema:
        required:
          - query_key
          - locale
        fields:
          query_key:
            type: enum
            values:
              - check_in_checkout
              - breakfast
              - parking
              - wifi
              - accessibility
              - luggage_storage
              - late_checkout
          locale:
            type: enum
            values:
              - en
              - es-ES
              - pt-PT
      output_schema:
        fields:
          facts_found: boolean
          fact_ids: list
          facts:
            type: list
            source: world.knowledge_facts
          message_key: string
      deterministic_behavior:
        query_key_to_fact_id:
          check_in_checkout: fact.check_in_checkout
          breakfast: fact.breakfast
          parking: fact.parking
          wifi: fact.wifi
          accessibility: fact.accessibility
          luggage_storage: fact.luggage_storage
          late_checkout: fact.late_checkout
        locale_changes_fact_values: false
        unknown_query_key_message_key: knowledge.not_found
      deterministic_examples:
        - input:
            query_key: breakfast
            locale: en
          output:
            facts_found: true
            fact_ids:
              - fact.breakfast
            message_key: knowledge.found
    - name: request_housekeeping
      purpose: Record a deterministic housekeeping request for an occupied room.
      deterministic: true
      input_schema:
        required:
          - room
          - request_type
        fields:
          room:
            type: integer
            allowed_source: world.room_state.occupied_rooms
          reservation_id:
            type: string
            optional: true
          request_type:
            type: enum
            values:
              - extra_towels
              - room_cleaning
              - do_not_disturb
          quantity:
            type: integer
            optional: true
            min: 1
            max: 6
          service_window:
            type: string
            optional: true
          notes:
            type: string
            optional: true
      output_schema:
        fields:
          accepted: boolean
          request_id: string_or_null
          message_key: string
      deterministic_behavior:
        accepted_when:
          - room_is_occupied
          - request_type_is_allowed
        request_id_format: HK-{room}-{request_type}
        invalid_room_message_key: housekeeping.invalid_room
        invalid_type_message_key: housekeeping.invalid_request_type
        accepted_message_key: housekeeping.accepted
      deterministic_examples:
        - input:
            room: 204
            request_type: extra_towels
            quantity: 2
          output:
            accepted: true
            request_id: HK-204-extra_towels
            message_key: housekeeping.accepted
        - input:
            room: 204
            request_type: room_cleaning
            service_window: after 12:00
          output:
            accepted: true
            request_id: HK-204-room_cleaning
            message_key: housekeeping.accepted
    - name: request_maintenance
      purpose: Record a deterministic maintenance request for an occupied room.
      deterministic: true
      input_schema:
        required:
          - room
          - issue_type
          - urgency
        fields:
          room:
            type: integer
            allowed_source: world.room_state.occupied_rooms
          reservation_id:
            type: string
            optional: true
          issue_type:
            type: enum
            values:
              - no_hot_water
              - room_too_cold
              - wifi_problem
              - other
          urgency:
            type: enum
            values:
              - standard
              - urgent
          notes:
            type: string
            optional: true
      output_schema:
        fields:
          accepted: boolean
          request_id: string_or_null
          message_key: string
      deterministic_behavior:
        accepted_when:
          - room_is_occupied
          - issue_type_is_allowed
          - urgency_is_allowed
        request_id_format: MT-{room}-{issue_type}
        invalid_room_message_key: maintenance.invalid_room
        accepted_message_key: maintenance.accepted
      deterministic_examples:
        - input:
            room: 204
            issue_type: no_hot_water
            urgency: urgent
          output:
            accepted: true
            request_id: MT-204-no_hot_water
            message_key: maintenance.accepted
        - input:
            room: 109
            issue_type: room_too_cold
            urgency: standard
          output:
            accepted: true
            request_id: MT-109-room_too_cold
            message_key: maintenance.accepted
    - name: request_late_checkout
      purpose: Evaluate and record a deterministic late checkout request.
      deterministic: true
      input_schema:
        required:
          - reservation_id
          - requested_time
        fields:
          reservation_id:
            type: string
            allowed_source: world.deterministic_reservations.reservation_id
          requested_time:
            type: string
            pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          accept_fee:
            type: boolean
            optional: true
            default: false
      output_schema:
        fields:
          approved: boolean
          fee_required: boolean
          fee_eur: integer_or_null
          requires_reception: boolean
          message_key: string
      deterministic_behavior:
        rules:
          - If requested_time is at or before reservation.late_checkout_profile.free_until_available, approve with fee_required false.
          - If requested_time is after free_until_available and at or before paid_until_available, approve only when accept_fee is true.
          - If requested_time is after paid_until_available, do not approve and set requires_reception true.
          - If the reservation has unavailable_reason, do not approve and use that reason.
        message_keys:
          free_approved: late_checkout.free_approved
          fee_required_not_accepted: late_checkout.fee_required_not_accepted
          paid_approved: late_checkout.paid_approved
          unavailable: late_checkout.unavailable
          reception_required: late_checkout.reception_required
      deterministic_examples:
        - input:
            reservation_id: R104
            requested_time: "12:00"
          output:
            approved: true
            fee_required: false
            fee_eur: null
            requires_reception: false
            message_key: late_checkout.free_approved
        - input:
            reservation_id: R104
            requested_time: "13:00"
            accept_fee: false
          output:
            approved: false
            fee_required: true
            fee_eur: 25
            requires_reception: false
            message_key: late_checkout.fee_required_not_accepted
        - input:
            reservation_id: R218
            requested_time: "12:00"
          output:
            approved: false
            fee_required: false
            fee_eur: null
            requires_reception: false
            message_key: late_checkout.unavailable
    - name: escalate_to_reception
      purpose: Route unresolved or policy-sensitive cases to reception.
      deterministic: true
      input_schema:
        required:
          - reason
        fields:
          reason:
            type: enum
            values:
              - accessibility_confirmation
              - ambiguous_guest_problem
              - late_checkout_after_14
              - parking_reservation
              - unsupported_request
          room:
            type: integer
            optional: true
          reservation_id:
            type: string
            optional: true
          notes:
            type: string
            optional: true
      output_schema:
        fields:
          accepted: boolean
          escalation_id: string
          message_key: string
      deterministic_behavior:
        accepted_when:
          - reason_is_allowed
        escalation_id_format: ESC-{reason}-{reservation_id_or_room_or_GENERAL}
        invalid_reason_message_key: escalation.invalid_reason
        accepted_message_key: escalation.accepted
      deterministic_examples:
        - input:
            reason: ambiguous_guest_problem
            room: 105
          output:
            accepted: true
            escalation_id: ESC-ambiguous_guest_problem-105
            message_key: escalation.accepted
        - input:
            reason: parking_reservation
            reservation_id: R305
          output:
            accepted: true
            escalation_id: ESC-parking_reservation-R305
            message_key: escalation.accepted
