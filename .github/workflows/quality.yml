name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HSD_TEST_DATABASE_URL: postgresql://hsd_test:hsd_test@127.0.0.1:5432/hsd_test
    services:
      postgres:
        image: postgres:17.8-alpine@sha256:3430fe182f5065a6ea505c3d432d2c7fff18fbab954df8f277c1dbf4c70124af
        env:
          POSTGRES_DB: hsd_test
          POSTGRES_PASSWORD: hsd_test
          POSTGRES_USER: hsd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hsd_test -d hsd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm audit:prod
      - run: pnpm typecheck
      - run: pnpm test:all
      - run: pnpm build
